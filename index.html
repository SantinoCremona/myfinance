<script>
"use strict";
/* ============ Datos (mismo formato que la versión anterior: no se pierde nada) ============ */
const LOCAL_KEY = 'myfinance-data-v1', MODE_KEY = 'mf-mode', CFG_KEY = 'mf-supabase', TABLE = 'mf_records'
const COLLS = ['customCategories','incomes','expenses','budgets','goals','contributions','investments','prices','netItems','cards','purchases','cardPayments']
const DEF_SETTINGS = { main_currency:'ARS', usd_rate:1000, opening_cash:0, opening_date:todayStr(), onboarding_done:false }
const INCOME_CATS = ['Sueldo','Freelance','Comisiones','Negocios','Alquileres','Otros ingresos']
const EXPENSE_CATS = ['Vivienda','Alimentación','Servicios','Transporte','Salud','Educación','Salidas y restaurantes','Compras personales','Suscripciones','Viajes','Entretenimiento','Otros']
const INV_TYPES = ['Plazo fijo','FCI','Dólares','CEDEAR','Acción','Bono','Cripto','Otra']
const INV_CAT = 'Inversiones'
const SQL = `create table if not exists public.mf_records (
  user_id uuid not null default auth.uid() references auth.users on delete cascade,
  coll text not null,
  id text not null,
  data jsonb not null,
  updated_at timestamptz not null default now(),
  primary key (user_id, coll, id)
);
alter table public.mf_records enable row level security;
drop policy if exists "mf_own_rows" on public.mf_records;
create policy "mf_own_rows" on public.mf_records
  for all using (auth.uid() = user_id) with check (auth.uid() = user_id);`

function emptyData(){ const d = { settings:{...DEF_SETTINGS}, snapshots:[] }; COLLS.forEach(c => d[c] = []); return d }
let D = emptyData(), STORE = null, ACCOUNT = null
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2))

function localStore(){
  let saved = {}
  try { saved = JSON.parse(localStorage.getItem(LOCAL_KEY) || '{}') || {} } catch {}
  const save = () => { try { localStorage.setItem(LOCAL_KEY, JSON.stringify(D)) } catch { toast('No se pudo guardar en este dispositivo') } }
  return {
    mode:'local',
    async load(){ const d = emptyData(); Object.assign(d, saved); d.settings = {...DEF_SETTINGS, ...(saved.settings||{})}; COLLS.forEach(c => d[c] = d[c] || []); return d },
    async put(coll, rec){ D[coll] = [...D[coll].filter(x => x.id !== rec.id), rec]; save() },
    async del(coll, id){ D[coll] = D[coll].filter(x => x.id !== id); save() },
    async putSettings(s){ D.settings = s; save() }
  }
}
function cloudStore(sb, user){
  const err = e => new Error((e && e.message) || 'error de conexión')
  return {
    mode:'nube',
    async load(){
      const rows = []
      for (let p = 0; ; p += 1000){
        const { data, error } = await sb.from(TABLE).select('coll,id,data').range(p, p + 999)
        if (error) throw err(error)
        rows.push(...data); if (data.length < 1000) break
      }
      const d = emptyData()
      for (const r of rows){
        if (r.coll === 'settings') d.settings = {...DEF_SETTINGS, ...r.data}
        else if (r.coll === 'snapshots') d.snapshots.push(r.data)
        else if (COLLS.includes(r.coll)) d[r.coll].push({...r.data, id:r.id})
      }
      return d
    },
    async put(coll, rec){
      D[coll] = [...D[coll].filter(x => x.id !== rec.id), rec]
      const { error } = await sb.from(TABLE).upsert({ user_id:user.id, coll, id:rec.id, data:JSON.parse(JSON.stringify(rec)), updated_at:new Date().toISOString() }, { onConflict:'user_id,coll,id' })
      if (error) throw err(error)
    },
    async del(coll, id){
      D[coll] = D[coll].filter(x => x.id !== id)
      const { error } = await sb.from(TABLE).delete().match({ user_id:user.id, coll, id })
      if (error) throw err(error)
    },
    async putSettings(s){
      D.settings = s
      const { error } = await sb.from(TABLE).upsert({ user_id:user.id, coll:'settings', id:'settings', data:s, updated_at:new Date().toISOString() }, { onConflict:'user_id,coll,id' })
      if (error) throw err(error)
    }
  }
}
async function save(fn){ try { await fn(); render() } catch (e) { render(); toast('No se pudo guardar: ' + e.message) } }

/* ============ Fechas y montos ============ */
function todayStr(){ const d = new Date(); return ymd(d) }
function ymd(d){ return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0') }
function parseD(s){ const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d) }
const ymOf = s => s.slice(0,7)
function addMonths(ym, n){ const [y,m] = ym.split('-').map(Number); const d = new Date(y, m-1+n, 1); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') }
function lastDay(ym){ const [y,m] = ym.split('-').map(Number); return new Date(y, m, 0).getDate() }
const endOfMonth = ym => ym + '-' + String(lastDay(ym)).padStart(2,'0')
const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre']
const monthName = ym => MESES[Number(ym.slice(5,7)) - 1]
const monthLong = ym => monthName(ym) + ' ' + ym.slice(0,4)
const dayLabel = s => parseD(s).toLocaleDateString('es-AR', { weekday:'short', day:'numeric', month:'short' }).replace('.', '')

const freqOf = r => r.frequency || r.recurrence || 'unico'
const isFixed = r => !['unico','none'].includes(freqOf(r))

/* Fechas en que ocurre un ingreso/gasto dentro de [from, to] */
function occurrences(r, from, to){
  const f = freqOf(r), start = r.date, end = r.end_date && r.end_date < to ? r.end_date : to
  const out = []
  if (!start) return out
  if (!isFixed(r)) { if (start >= from && start <= to) out.push(start); return out }
  if (f === 'semanal' || f === 'quincenal'){
    const step = f === 'semanal' ? 7 : 14, d = parseD(start)
    while (ymd(d) <= end){ const s = ymd(d); if (s >= from) out.push(s); d.setDate(d.getDate() + step) }
    return out
  }
  const step = ({ bimestral:2, trimestral:3, semestral:6, anual:12 })[f] || 1
  const day = Number(start.slice(8,10))
  for (let ym = ymOf(start), i = 0; ym <= ymOf(end); ym = addMonths(ym, 1), i++){
    if (i % step) continue
    const s = ym + '-' + String(Math.min(day, lastDay(ym))).padStart(2,'0')
    if (s >= start && s >= from && s <= end) out.push(s)
  }
  return out
}
function toARS(amount, cur){ return cur === 'USD' ? amount * (Number(D.settings.usd_rate) || 0) : amount }
function moves(from, to){
  const out = []
  for (const r of D.incomes) for (const d of occurrences(r, from, to)) out.push({ kind:'in', r, date:d, v:toARS(r.amount, r.currency) })
  for (const r of D.expenses) for (const d of occurrences(r, from, to)) out.push({ kind:'out', r, date:d, v:toARS(r.amount, r.currency) })
  return out.sort((a,b) => a.date.localeCompare(b.date))
}
const sum = (arr, k) => arr.filter(m => m.kind === k).reduce((a,m) => a + m.v, 0)
function cashToday(){
  const s = D.settings, t = todayStr(), from = s.opening_date || '1900-01-01'
  if (from > t) return Number(s.opening_cash) || 0
  const m = moves(from, t)
  return (Number(s.opening_cash) || 0) + sum(m,'in') - sum(m,'out')
}
const invValue = i => (Number(i.units)||0) * (Number(i.current_price ?? i.buy_price) || 0)
const invCost = i => (Number(i.units)||0) * (Number(i.buy_price)||0)

const fmt0 = new Intl.NumberFormat('es-AR', { maximumFractionDigits:0 })
const fmt2 = new Intl.NumberFormat('es-AR', { minimumFractionDigits:0, maximumFractionDigits:2 })
function money(v, cur){ const neg = v < 0; const s = (cur === 'USD' ? 'US$ ' : '$ ') + (cur === 'USD' ? fmt2 : fmt0).format(Math.abs(v)); return neg ? '−' + s : s }
function parseNum(s){
  s = String(s || '').replace(/[^\d.,-]/g, '')
  if (!s) return NaN
  if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.')
  else if ((s.match(/\./g) || []).length > 1 || /\.\d{3}$/.test(s)) s = s.replace(/\./g, '')
  return Number(s)
}
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' })[c])

/* ============ Íconos ============ */
const ICONS = {
  home:'<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/>',
  in:'<path d="M12 19V5M5 12l7-7 7 7"/>',
  out:'<path d="M12 5v14M5 12l7 7 7-7"/>',
  inv:'<path d="M3 17l6-6 4 4 8-8M15 7h6v6"/>',
  sum:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
  gear:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>',
  plus:'<path d="M12 5v14M5 12h14"/>', minus:'<path d="M5 12h14"/>', back:'<path d="M15 18l-6-6 6-6"/>'
}
const icon = (n, s = 22) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n]}</svg>`
const LOGO = `<svg viewBox="0 0 32 32" width="30" height="30" aria-hidden="true" style="border-radius:8px;flex:none"><rect width="32" height="32" fill="#121513"/><path d="M8 21.1 13.4 16.6 17.6 19.2 24 11.5" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/><circle cx="24" cy="11.5" r="2.1" fill="#2fbf71"/></svg>`

/* ============ Estado de pantalla ============ */
const UI = { tab:'inicio', horizon:0, ym:{ ingresos:ymOf(todayStr()), gastos:ymOf(todayStr()), balance:ymOf(todayStr()) }, resumen:'balance' }
const app = document.getElementById('app')

function render(){
  if (!STORE) return
  const views = { inicio:vInicio, ingresos:() => vMovs('in'), gastos:() => vMovs('out'), inversiones:vInv, resumen:vResumen, ajustes:vAjustes }
  const tabs = [['inicio','Inicio','home'],['ingresos','Ingresos','in'],['gastos','Gastos','out'],['inversiones','Inversiones','inv'],['resumen','Resumen','sum']]
  app.innerHTML = `<div class="wrap">
    <header class="top"><div class="brand">${LOGO}<span>My<b>Finance</b></span></div>
    <button class="iconbtn" data-act="tab" data-v="ajustes" aria-label="Ajustes">${icon('gear')}</button></header>
    ${views[UI.tab]()}
  </div>
  <nav class="tabs"><div class="in">${tabs.map(([k,l,i]) => `<button class="${UI.tab===k?'on':''}" data-act="tab" data-v="${k}">${icon(i)}<span>${l}</span></button>`).join('')}</div></nav>`
}

/* ---------- Inicio ---------- */
function vInicio(){
  const s = D.settings, t = todayStr()
  if (!s.onboarding_done && !D.incomes.length && !D.expenses.length){
    return `<div class="card"><h1>¡Hola!</h1><p class="sub" style="margin-top:6px">Para empezar, contanos cuánta plata tenés hoy. Sumá lo que tenés en cuentas, billeteras y efectivo.</p>
      <div class="f"><label for="ob">¿Cuánta plata tenés hoy?</label><input id="ob" class="inp" inputmode="decimal" placeholder="Ej: 350.000" style="font-size:22px;font-weight:600"></div>
      <button class="btn dark" data-act="onboard">Empezar</button></div>`
  }
  const hoy = cashToday()
  const ends = [0,1,2].map(n => endOfMonth(addMonths(ymOf(t), n)))
  const end = ends[UI.horizon]
  const next = moves(addDay(t), end)
  const cobrar = sum(next,'in'), pagar = sum(next,'out'), queda = hoy + cobrar - pagar
  const label = n => 'Fin de ' + monthName(ymOf(ends[n]))
  return `
  <div class="card"><div class="label">Plata disponible hoy</div>
    <div class="big ${hoy < 0 ? 'warn' : ''}">${money(hoy)}</div>
    <div class="hint">Lo que tenés ahora, después de todos tus ingresos y gastos hasta hoy. <a href="#" data-act="fixcash" style="color:var(--ink2)">Corregir</a></div></div>

  <div class="card"><div class="label">¿Cuánto te va a quedar a fin de…?</div>
    <div class="chips" style="margin:12px 0 4px;display:grid;grid-template-columns:repeat(3,1fr)">${[0,1,2].map(n => `<button class="chip ${UI.horizon===n?'on':''}" data-act="hz" data-v="${n}" style="text-transform:capitalize">${monthName(ymOf(ends[n]))}</button>`).join('')}</div>
    <div class="big ${queda < 0 ? 'warn' : ''}">${money(queda)}</div>
    <div class="calc">
      <div><span>Hoy tenés</span><span>${money(hoy)}</span></div>
      <div><span>+ Vas a cobrar</span><span class="pos">${money(cobrar)}</span></div>
      <div><span>− Vas a pagar</span><span>${money(pagar)}</span></div>
      <div class="tot"><span>Te queda a ${label(UI.horizon).toLowerCase()}</span><span>${money(queda)}</span></div>
    </div>
    ${queda < 0 ? `<div class="alert">Ojo: con lo que tenés cargado, no te alcanza hasta esa fecha.</div>` : ''}
  </div>

  <div class="two" style="margin:4px 0 6px">
    <button class="btn in" data-act="new" data-v="in">${icon('plus',20)} Ingreso</button>
    <button class="btn dark" data-act="new" data-v="out">${icon('minus',20)} Gasto</button>
  </div>

  <h2>Próximos movimientos</h2>
  <div class="list">${next.length ? next.slice(0,8).map(moveItem).join('') : `<div class="empty">No tenés nada cargado para las próximas semanas.</div>`}</div>`
}
function addDay(s){ const d = parseD(s); d.setDate(d.getDate()+1); return ymd(d) }
function moveItem(m){
  const r = m.r, cur = r.currency || 'ARS'
  return `<button class="item" data-act="edit" data-k="${m.kind}" data-id="${esc(r.id)}">
    <div class="t"><div class="n">${esc(r.description)}</div><div class="d">${dayLabel(m.date)}${isFixed(r) ? ' · todos los meses' : ''}</div></div>
    <div class="a ${m.kind==='in'?'pos':''}">${m.kind==='in'?'+':'−'} ${money(r.amount, cur)}${cur==='USD' ? `<small>${money(m.v)}</small>` : ''}</div></button>`
}

/* ---------- Ingresos / Gastos ---------- */
function vMovs(kind){
  const key = kind === 'in' ? 'ingresos' : 'gastos', coll = kind === 'in' ? D.incomes : D.expenses
  const ym = UI.ym[key], from = ym + '-01', to = endOfMonth(ym)
  const word = kind === 'in' ? 'Ingresos' : 'Gastos'
  const fixed = [], vari = []
  for (const r of coll){
    const occ = occurrences(r, from, to)
    if (!occ.length) continue
    for (const d of occ) (isFixed(r) ? fixed : vari).push({ kind, r, date:d, v:toARS(r.amount, r.currency) })
  }
  fixed.sort((a,b) => a.date.localeCompare(b.date)); vari.sort((a,b) => b.date.localeCompare(a.date))
  const tf = fixed.reduce((a,m) => a + m.v, 0), tv = vari.reduce((a,m) => a + m.v, 0)
  const itemF = m => `<button class="item" data-act="edit" data-k="${kind}" data-id="${esc(m.r.id)}">
      <div class="t"><div class="n">${esc(m.r.description)}</div><div class="d">El día ${Number(m.date.slice(8))} de cada mes${m.r.category ? ' · ' + esc(m.r.category) : ''}</div></div>
      <div class="a ${kind==='in'?'pos':''}">${money(m.r.amount, m.r.currency)}${m.r.currency==='USD'?`<small>${money(m.v)}</small>`:''}</div></button>`
  const itemV = m => `<button class="item" data-act="edit" data-k="${kind}" data-id="${esc(m.r.id)}">
      <div class="t"><div class="n">${esc(m.r.description)}</div><div class="d">${dayLabel(m.date)}${m.r.category ? ' · ' + esc(m.r.category) : ''}</div></div>
      <div class="a ${kind==='in'?'pos':''}">${money(m.r.amount, m.r.currency)}${m.r.currency==='USD'?`<small>${money(m.v)}</small>`:''}</div></button>`
  return `<div class="row"><h1>${word}</h1><button class="btn ${kind==='in'?'in':'dark'} small" data-act="new" data-v="${kind}">${icon('plus',18)} Agregar</button></div>
  <p class="sub">${kind==='in' ? 'Toda la plata que te entra.' : 'Toda la plata que sale.'}</p>
  ${monthNav(key)}
  <div class="card"><div class="label">Total de ${word.toLowerCase()} en ${monthName(ym)}</div><div class="big ${kind==='in'?'pos':''}">${money(tf+tv)}</div>
    <div class="hint">Fijos ${money(tf)} · Variables ${money(tv)}</div></div>
  <h2>Fijos <span class="muted" style="font-weight:400;font-size:15px">· se repiten todos los meses</span></h2>
  <div class="list">${fixed.length ? fixed.map(itemF).join('') : `<div class="empty">${kind==='in' ? 'Ej: tu sueldo.' : 'Ej: alquiler, expensas, servicios, cuotas.'} Cargalos una sola vez y se repiten solos.</div>`}</div>
  <h2>Variables <span class="muted" style="font-weight:400;font-size:15px">· de una sola vez</span></h2>
  <div class="list">${vari.length ? vari.map(itemV).join('') : `<div class="empty">${kind==='in' ? 'Ej: un trabajo extra, un bono.' : 'Ej: supermercado, una salida, un regalo.'}</div>`}</div>`
}
function monthNav(key){
  return `<div class="monthnav"><button data-act="mon" data-k="${key}" data-v="-1" aria-label="Mes anterior">‹</button><b>${monthLong(UI.ym[key])}</b><button data-act="mon" data-k="${key}" data-v="1" aria-label="Mes siguiente">›</button></div>`
}

/* ---------- Inversiones ---------- */
function vInv(){
  const inv = D.investments
  const val = inv.reduce((a,i) => a + toARS(invValue(i), i.currency), 0)
  const cost = inv.reduce((a,i) => a + toARS(invCost(i), i.currency), 0)
  const gain = val - cost, pct = cost ? gain / cost * 100 : 0
  const hasTick = inv.some(i => i.ticker)
  return `<div class="row"><h1>Inversiones</h1><button class="btn dark small" data-act="newinv">${icon('plus',18)} Agregar</button></div>
  <p class="sub">Plazos fijos, fondos, dólares, acciones, etc.</p>
  <div class="card"><div class="label">Tus inversiones hoy valen</div><div class="big">${money(val)}</div>
    ${inv.length ? `<div class="hint">Pusiste ${money(cost)} · ${gain >= 0 ? 'Ganaste' : 'Perdiste'} <b class="${gain>=0?'pos':'warn'}">${money(Math.abs(gain))} (${fmt2.format(Math.abs(pct))}%)</b></div>` : ''}
    ${hasTick ? `<button class="btn ghost small" style="margin-top:12px" data-act="quotes">Actualizar precios</button>` : ''}</div>
  <div class="list">${inv.length ? [...inv].sort((a,b) => toARS(invValue(b),b.currency) - toARS(invValue(a),a.currency)).map(i => {
    const v = invValue(i), c = invCost(i), g = v - c
    return `<button class="item" data-act="editinv" data-id="${esc(i.id)}"><div class="t"><div class="n">${esc(i.name)}</div>
      <div class="d">${esc(i.type || '')}${c ? ` · <span class="${g>=0?'pos':'warn'}">${g>=0?'+':'−'}${fmt2.format(Math.abs(g/c*100))}%</span>` : ''}</div></div>
      <div class="a">${money(v, i.currency)}${i.currency==='USD'?`<small>${money(toARS(v,'USD'))}</small>`:''}</div></button>`
  }).join('') : `<div class="empty">Todavía no cargaste inversiones.</div>`}</div>`
}

/* ---------- Resumen: balance mensual y patrimonio ---------- */
function vResumen(){
  return `<h1>Resumen</h1><p class="sub">Cómo te fue cada mes y cuánto tenés en total.</p>
  <div class="seg"><button class="${UI.resumen==='balance'?'on':''}" data-act="res" data-v="balance">Balance mensual</button><button class="${UI.resumen==='patrimonio'?'on':''}" data-act="res" data-v="patrimonio">Patrimonio neto</button></div>
  ${UI.resumen === 'balance' ? vBalance() : vPatrimonio()}`
}
function monthTotals(ym){
  const m = moves(ym + '-01', endOfMonth(ym)), notInv = x => x.r.category !== INV_CAT
  const ing = m.filter(x => x.kind==='in' && notInv(x)).reduce((a,x) => a + x.v, 0)
  const gas = m.filter(x => x.kind==='out' && notInv(x)).reduce((a,x) => a + x.v, 0)
  const inv = m.filter(x => !notInv(x)).reduce((a,x) => a + (x.kind==='out' ? x.v : -x.v), 0)
  return { m, ing, gas, inv }
}
function vBalance(){
  const ym = UI.ym.balance, T = monthTotals(ym), res = T.ing - T.gas
  const months = [-5,-4,-3,-2,-1,0].map(n => addMonths(ym, n)), tots = months.map(monthTotals)
  const max = Math.max(1, ...tots.map(t => Math.max(t.ing, t.gas)))
  const cats = {}
  T.m.filter(x => x.kind==='out' && x.r.category !== INV_CAT).forEach(x => { const c = x.r.category || 'Otros'; cats[c] = (cats[c]||0) + x.v })
  const catList = Object.entries(cats).sort((a,b) => b[1]-a[1])
  return `${monthNav('balance')}
  <div class="card">
    <div class="calc" style="border:0;margin:0;padding:0">
      <div><span>Te entró</span><span class="pos">${money(T.ing)}</span></div>
      <div><span>Gastaste</span><span>${money(T.gas)}</span></div>
      <div class="tot"><span>${res >= 0 ? 'Te sobró' : 'Te faltó'}</span><span class="${res>=0?'pos':'warn'}">${money(Math.abs(res))}</span></div>
    </div>
    ${T.inv > 0 ? `<div class="hint">Además pasaste ${money(T.inv)} a inversiones.</div>` : ''}
    ${T.ing > 0 && res > 0 ? `<div class="hint">Ahorraste el ${fmt0.format(res / T.ing * 100)}% de lo que te entró.</div>` : ''}
  </div>
  <div class="card"><div class="label">Últimos 6 meses</div>
    <div class="bars">${months.map((m,i) => `<div class="m ${m===ym?'sel':''}" data-act="pickm" data-v="${m}" style="cursor:pointer"><div class="p">
      <i style="height:${tots[i].ing/max*100}%;background:var(--in)" title="Ingresos ${money(tots[i].ing)}"></i>
      <i style="height:${tots[i].gas/max*100}%;background:var(--ink2)" title="Gastos ${money(tots[i].gas)}"></i></div>
      <div class="lb">${monthName(m).slice(0,3)}</div></div>`).join('')}</div>
    <div class="legend"><span style="--c:var(--in)">Ingresos</span><span style="--c:var(--ink2)">Gastos</span></div></div>
  <h2>¿En qué gastaste en ${monthName(ym)}?</h2>
  <div class="card">${catList.length ? catList.map(([c,v]) => `<div style="margin-bottom:12px"><div class="row"><span>${esc(c)}</span><b style="font-variant-numeric:tabular-nums">${money(v)}</b></div>
    <div class="catbar"><i style="width:${v/catList[0][1]*100}%"></i></div></div>`).join('') : `<div class="muted">No hay gastos este mes.</div>`}</div>`
}
function vPatrimonio(){
  const cash = cashToday()
  const inv = D.investments.reduce((a,i) => a + toARS(invValue(i), i.currency), 0)
  const act = D.netItems.filter(n => n.kind !== 'pasivo'), pas = D.netItems.filter(n => n.kind === 'pasivo')
  const tAct = cash + inv + act.reduce((a,n) => a + toARS(n.amount, n.currency), 0)
  const tPas = pas.reduce((a,n) => a + toARS(n.amount, n.currency), 0)
  const net = tAct - tPas
  const it = n => `<button class="item" data-act="editnet" data-id="${esc(n.id)}"><div class="t"><div class="n">${esc(n.name)}</div></div>
     <div class="a">${money(n.amount, n.currency)}${n.currency==='USD'?`<small>${money(toARS(n.amount,'USD'))}</small>`:''}</div></button>`
  return `<div class="card"><div class="label">Tu patrimonio neto</div><div class="big ${net<0?'warn':''}">${money(net)}</div>
    <div class="hint">Es todo lo que tenés menos todo lo que debés.</div>
    <div class="calc"><div><span>Lo que tenés</span><span class="pos">${money(tAct)}</span></div><div><span>− Lo que debés</span><span>${money(tPas)}</span></div>
    <div class="tot"><span>Patrimonio neto</span><span>${money(net)}</span></div></div></div>
  <div class="row"><h2>Lo que tenés</h2><button class="btn ghost small" data-act="newnet" data-v="activo">${icon('plus',16)} Agregar</button></div>
  <div class="list">
    <button class="item" data-act="tab" data-v="inicio"><div class="t"><div class="n">Plata disponible</div><div class="d">Se calcula sola con tus ingresos y gastos</div></div><div class="a">${money(cash)}</div></button>
    <button class="item" data-act="tab" data-v="inversiones"><div class="t"><div class="n">Inversiones</div><div class="d">Se calcula sola desde Inversiones</div></div><div class="a">${money(inv)}</div></button>
    ${act.map(it).join('')}
  </div>
  ${!act.length ? `<p class="hint" style="margin-top:-4px">Podés sumar una casa, un auto u otros bienes.</p>` : ''}
  <div class="row"><h2>Lo que debés</h2><button class="btn ghost small" data-act="newnet" data-v="pasivo">${icon('plus',16)} Agregar</button></div>
  <div class="list">${pas.length ? pas.map(it).join('') : `<div class="empty">Ej: un préstamo, lo que falta pagar de la tarjeta, una deuda con alguien.</div>`}</div>`
}

/* ============ Formularios (hoja que sube desde abajo) ============ */
function sheet(html, onReady){
  const ov = document.createElement('div'); ov.className = 'ov'
  ov.innerHTML = `<div class="sheet" role="dialog" aria-modal="true">${html}</div>`
  ov.addEventListener('click', e => { if (e.target === ov || e.target.closest('[data-close]')) ov.remove() })
  document.body.appendChild(ov); onReady && onReady(ov.querySelector('.sheet'), () => ov.remove())
}
function amountField(id, val, cur){
  return `<div class="amt"><input id="${id}" class="inp" inputmode="decimal" placeholder="0" value="${val != null ? esc(fmt2.format(val)) : ''}">
    <select id="${id}-cur" class="inp" style="flex:none;width:96px;font-size:17px"><option value="ARS" ${cur!=='USD'?'selected':''}>$</option><option value="USD" ${cur==='USD'?'selected':''}>US$</option></select></div>`
}
function bindAmount(el){ el.addEventListener('blur', () => { const n = parseNum(el.value); if (n > 0) el.value = fmt2.format(n) }) }
function catChips(list, sel){ return `<div class="chips" data-chips>${list.map(c => `<button type="button" class="chip ${c===sel?'on':''}" data-c="${esc(c)}">${esc(c)}</button>`).join('')}</div>` }
function bindChips(root){ root.querySelectorAll('[data-chips]').forEach(g => g.addEventListener('click', e => { const b = e.target.closest('.chip'); if (!b) return; g.querySelectorAll('.chip').forEach(x => x.classList.remove('on')); b.classList.add('on') })) }
const chipVal = root => { const b = root.querySelector('[data-chips] .chip.on'); return b ? b.dataset.c : '' }

function moveForm(kind, rec){
  const isIn = kind === 'in', coll = isIn ? 'incomes' : 'expenses'
  const custom = D.customCategories.filter(c => c.kind === (isIn ? 'income' : 'expense')).map(c => c.name)
  const cats = [...new Set([...(isIn ? INCOME_CATS : EXPENSE_CATS), ...custom, ...(rec && rec.category ? [rec.category] : [])])]
  let fixed = rec ? isFixed(rec) : false
  const word = isIn ? 'ingreso' : 'gasto'
  sheet(`<h3>${rec ? 'Editar ' + word : (isIn ? 'Nuevo ingreso' : 'Nuevo gasto')}</h3>
    <div class="f"><label for="ds">¿Qué es?</label><input id="ds" class="inp" placeholder="${isIn ? 'Ej: Sueldo' : 'Ej: Alquiler, Supermercado'}" value="${esc(rec ? rec.description : '')}"></div>
    <div class="f"><label for="am">¿Cuánto?</label>${amountField('am', rec ? rec.amount : null, rec ? rec.currency : 'ARS')}</div>
    <div class="f"><label>¿Es fijo o variable?</label><div class="opt">
      <button type="button" data-fx="1" class="${fixed?'on':''}"><b>Fijo</b><span>Se repite todos los meses</span></button>
      <button type="button" data-fx="0" class="${!fixed?'on':''}"><b>Variable</b><span>Una sola vez</span></button></div></div>
    <div class="f"><label for="dt" id="dtl"></label><input id="dt" type="date" class="inp" value="${rec ? rec.date : todayStr()}"><div class="hint" id="dth"></div></div>
    <div class="f" id="endf"><label for="en">¿Hasta cuándo? <span class="muted" style="font-weight:400">(opcional)</span></label><input id="en" type="date" class="inp" value="${rec && rec.end_date ? rec.end_date : ''}"><div class="hint">Dejalo vacío si sigue sin fecha de fin.</div></div>
    <div class="f"><label>Categoría</label>${catChips(cats, rec ? rec.category : (isIn ? 'Sueldo' : 'Otros'))}</div>
    <div class="err" id="er"></div>
    <div class="actions"><button class="btn ${isIn?'in':'dark'}" id="ok">Guardar</button>
      ${rec && isFixed(rec) ? `<button class="btn ghost" id="stop">Ya no se repite (terminar hoy)</button>` : ''}
      ${rec ? `<button class="btn danger" id="del">Borrar</button>` : ''}
      <button class="btn ghost" data-close>Cancelar</button></div>`, (el, close) => {
    const $ = s => el.querySelector(s)
    const sync = () => {
      el.querySelectorAll('[data-fx]').forEach(b => b.classList.toggle('on', (b.dataset.fx === '1') === fixed))
      $('#dtl').textContent = fixed ? (isIn ? '¿Qué día cobrás? (desde cuándo)' : '¿Qué día pagás? (desde cuándo)') : '¿Cuándo?'
      $('#dth').textContent = fixed ? 'Se va a repetir ese mismo día todos los meses.' : ''
      $('#endf').style.display = fixed ? '' : 'none'
    }
    el.querySelectorAll('[data-fx]').forEach(b => b.onclick = () => { fixed = b.dataset.fx === '1'; sync() })
    sync(); bindChips(el); bindAmount($('#am'))
    if (!rec) setTimeout(() => $('#ds').focus(), 50)
    $('#ok').onclick = () => {
      const desc = $('#ds').value.trim(), amount = parseNum($('#am').value), date = $('#dt').value, end = fixed ? $('#en').value : ''
      const er = !desc ? 'Escribí qué es.' : !(amount > 0) ? 'Poné un monto mayor a 0.' : !date ? 'Elegí una fecha.' : end && end < date ? 'La fecha de fin tiene que ser después del inicio.' : ''
      if (er) { $('#er').textContent = er; return }
      const base = { ...(rec || { id:uid(), created_at:new Date().toISOString() }), description:desc, amount, date, category:chipVal(el), currency:$('#am-cur').value, type:fixed ? 'fijo' : 'variable', end_date:end || null }
      const out = isIn
        ? { ...base, frequency:fixed ? (rec && isFixed(rec) ? freqOf(rec) : 'mensual') : 'unico' }
        : { ...base, recurrence:fixed ? (rec && isFixed(rec) ? freqOf(rec) : 'mensual') : 'none', status:date <= todayStr() ? 'pagado' : 'pendiente', subcategory:base.subcategory || '', payment_method:base.payment_method || '', paid_months:base.paid_months || [] }
      close(); save(() => STORE.put(coll, out)); toast('Guardado')
    }
    if ($('#stop')) $('#stop').onclick = () => { close(); save(() => STORE.put(coll, { ...rec, end_date:todayStr() })); toast('Listo, ya no se repite') }
    if ($('#del')) $('#del').onclick = () => {
      if (!confirm(isFixed(rec) ? '¿Borrar este ' + word + ' de todos los meses (también de los meses pasados)?\n\nSi solo dejó de repetirse, mejor usá "Ya no se repite".' : '¿Borrar este ' + word + '?')) return
      close(); save(() => STORE.del(coll, rec.id)); toast('Borrado')
    }
  })
}

function invForm(rec){
  const simple = !rec || !rec.ticker
  const units = rec ? Number(rec.units) || 1 : 1
  sheet(`<h3>${rec ? 'Editar inversión' : 'Nueva inversión'}</h3>
    <div class="f"><label for="nm">¿En qué invertiste?</label><input id="nm" class="inp" placeholder="Ej: Plazo fijo Galicia" value="${esc(rec ? rec.name : '')}"></div>
    <div class="f"><label>Tipo</label>${catChips(INV_TYPES, rec ? rec.type : 'Plazo fijo')}</div>
    <div class="f"><label for="pu">¿Cuánto pusiste?</label>${amountField('pu', rec ? invCost(rec) : null, rec ? rec.currency : 'ARS')}</div>
    <div class="f"><label for="vh">¿Cuánto vale hoy? <span class="muted" style="font-weight:400">(opcional)</span></label><input id="vh" class="inp" inputmode="decimal" placeholder="Igual a lo que pusiste" value="${rec && rec.current_price != null ? esc(fmt2.format(invValue(rec))) : ''}"></div>
    ${!rec ? `<div class="f"><label class="check"><input type="checkbox" id="dsc" checked> <span>Descontarlo de mi plata disponible<br><span class="muted">Se registra como un movimiento de hoy.</span></span></label></div>` : ''}
    <details class="adv" ${simple ? '' : 'open'}><summary>Acciones, CEDEARs o cripto con precio automático</summary>
      <div class="f"><label for="tk">Código (ticker)</label><input id="tk" class="inp" placeholder="Ej: GGAL.BA, AAPL, BTC-USD" value="${esc(rec && rec.ticker || '')}" autocapitalize="characters"></div>
      <div class="f"><label for="un">Cantidad</label><input id="un" class="inp" inputmode="decimal" value="${rec && rec.ticker ? esc(fmt2.format(units)) : ''}"></div></details>
    <div class="err" id="er"></div>
    <div class="actions"><button class="btn dark" id="ok">Guardar</button>
      ${rec ? `<button class="btn ghost" id="sell">La vendí / la rescaté</button><button class="btn danger" id="del">Borrar</button>` : ''}
      <button class="btn ghost" data-close>Cancelar</button></div>`, (el, close) => {
    const $ = s => el.querySelector(s)
    bindChips(el); bindAmount($('#pu')); bindAmount($('#vh'))
    $('#ok').onclick = () => {
      const name = $('#nm').value.trim(), cost = parseNum($('#pu').value), vh = parseNum($('#vh').value)
      const ticker = $('#tk').value.trim().toUpperCase(), u = ticker ? parseNum($('#un').value) : 1
      const er = !name ? 'Escribí en qué invertiste.' : !(cost > 0) ? 'Poné cuánto pusiste.' : ticker && !(u > 0) ? 'Poné la cantidad.' : ''
      if (er) { $('#er').textContent = er; return }
      const cur = $('#pu-cur').value
      const out = { ...(rec || { id:uid(), created_at:new Date().toISOString(), buy_date:todayStr() }), name, type:chipVal(el), currency:cur, ticker, units:u, buy_price:cost / u, current_price:vh > 0 ? vh / u : (rec && rec.ticker === ticker && rec.current_price != null && ticker ? rec.current_price : null) }
      const disc = !rec && $('#dsc') && $('#dsc').checked
      close()
      save(async () => {
        await STORE.put('investments', out)
        if (disc) await STORE.put('expenses', { id:uid(), created_at:new Date().toISOString(), description:'Inversión: ' + name, amount:cost, date:todayStr(), category:INV_CAT, subcategory:'', payment_method:'', currency:cur, type:'variable', status:'pagado', recurrence:'none', end_date:null, paid_months:[] })
      })
      toast('Guardado')
    }
    if (rec){
      $('#sell').onclick = () => {
        const v = invValue(rec)
        const ans = prompt('¿Por cuánto la vendiste / rescataste? (' + (rec.currency === 'USD' ? 'US$' : '$') + ')\nEsa plata se suma a tu plata disponible.', fmt2.format(v))
        if (ans == null) return
        const n = parseNum(ans); if (!(n >= 0)) return toast('Monto no válido')
        close()
        save(async () => {
          await STORE.put('incomes', { id:uid(), created_at:new Date().toISOString(), description:'Venta: ' + rec.name, amount:n, date:todayStr(), category:INV_CAT, type:'variable', currency:rec.currency || 'ARS', frequency:'unico', end_date:null })
          await STORE.del('investments', rec.id)
        })
        toast('Listo, se sumó a tu plata disponible')
      }
      $('#del').onclick = () => { if (!confirm('¿Borrar esta inversión?')) return; close(); save(() => STORE.del('investments', rec.id)); toast('Borrado') }
    }
  })
}

function netForm(kind, rec){
  kind = rec ? (rec.kind === 'pasivo' ? 'pasivo' : 'activo') : kind
  const isAct = kind === 'activo'
  sheet(`<h3>${rec ? 'Editar' : isAct ? 'Agregar algo que tenés' : 'Agregar una deuda'}</h3>
    <div class="f"><label for="nm">${isAct ? '¿Qué es?' : '¿Qué debés?'}</label><input id="nm" class="inp" placeholder="${isAct ? 'Ej: Departamento, Auto' : 'Ej: Préstamo personal, Tarjeta Visa'}" value="${esc(rec ? rec.name : '')}"></div>
    <div class="f"><label for="am">${isAct ? '¿Cuánto vale?' : '¿Cuánto falta pagar?'}</label>${amountField('am', rec ? rec.amount : null, rec ? rec.currency : (isAct ? 'USD' : 'ARS'))}</div>
    ${!isAct ? `<p class="hint">Las cuotas que pagás todos los meses cargalas también como gasto fijo, así se descuentan de tu plata.</p>` : ''}
    <div class="err" id="er"></div>
    <div class="actions"><button class="btn dark" id="ok">Guardar</button>${rec ? `<button class="btn danger" id="del">Borrar</button>` : ''}<button class="btn ghost" data-close>Cancelar</button></div>`, (el, close) => {
    const $ = s => el.querySelector(s); bindAmount($('#am'))
    $('#ok').onclick = () => {
      const name = $('#nm').value.trim(), amount = parseNum($('#am').value)
      if (!name || !(amount > 0)) { $('#er').textContent = 'Completá el nombre y un monto mayor a 0.'; return }
      const out = { ...(rec || { id:uid(), created_at:new Date().toISOString(), category:isAct ? 'Otros bienes' : 'Deuda' }), name, kind, amount, currency:$('#am-cur').value }
      close(); save(() => STORE.put('netItems', out)); toast('Guardado')
    }
    if ($('#del')) $('#del').onclick = () => { if (!confirm('¿Borrar?')) return; close(); save(() => STORE.del('netItems', rec.id)) }
  })
}

function fixCashForm(){
  sheet(`<h3>Corregir mi saldo</h3><p class="sub">Poné cuánta plata tenés hoy en total (cuentas, billeteras y efectivo). La app ajusta el saldo a ese número.</p>
    <div class="f"><label for="cs">¿Cuánta plata tenés hoy?</label><input id="cs" class="inp" inputmode="decimal" value="${fmt0.format(Math.round(cashToday()))}" style="font-size:22px;font-weight:600"></div>
    <div class="err" id="er"></div><div class="actions"><button class="btn dark" id="ok">Guardar</button><button class="btn ghost" data-close>Cancelar</button></div>`, (el, close) => {
    const inp = el.querySelector('#cs'); bindAmount(inp); setTimeout(() => inp.select(), 50)
    el.querySelector('#ok').onclick = () => {
      const v = parseNum(inp.value); if (isNaN(v)) { el.querySelector('#er').textContent = 'Poné un número.'; return }
      const t = todayStr(), m = moves(t, t)
      close(); save(() => STORE.putSettings({ ...D.settings, opening_date:t, opening_cash:v - (sum(m,'in') - sum(m,'out')), onboarding_done:true })); toast('Saldo corregido')
    }
  })
}

/* ============ Acciones ============ */
let toastT
function toast(msg){ document.querySelectorAll('.toast').forEach(x => x.remove()); const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); clearTimeout(toastT); toastT = setTimeout(() => t.remove(), 2600) }

app.addEventListener('click', async e => {
  const b = e.target.closest('[data-act]'); if (!b) return
  e.preventDefault()
  const a = b.dataset.act, v = b.dataset.v
  if (a === 'tab'){ UI.tab = v; render(); scrollTo(0,0) }
  else if (a === 'hz'){ UI.horizon = Number(v); render() }
  else if (a === 'mon'){ UI.ym[b.dataset.k] = addMonths(UI.ym[b.dataset.k], Number(v)); render() }
  else if (a === 'pickm'){ UI.ym.balance = v; render() }
  else if (a === 'res'){ UI.resumen = v; render() }
  else if (a === 'new') moveForm(v)
  else if (a === 'edit'){ const coll = b.dataset.k === 'in' ? D.incomes : D.expenses; const r = coll.find(x => x.id === b.dataset.id); if (r) moveForm(b.dataset.k, r) }
  else if (a === 'newinv') invForm()
  else if (a === 'editinv') invForm(D.investments.find(x => x.id === b.dataset.id))
  else if (a === 'newnet') netForm(v)
  else if (a === 'editnet') netForm(null, D.netItems.find(x => x.id === b.dataset.id))
  else if (a === 'fixcash') fixCashForm()
  else if (a === 'onboard'){
    const n = parseNum(document.getElementById('ob').value)
    save(() => STORE.putSettings({ ...D.settings, opening_cash:isNaN(n) ? 0 : n, opening_date:todayStr(), onboarding_done:true }))
  }
  else if (a === 'saveusd'){ const n = parseNum(document.getElementById('usd').value); if (!(n > 0)) return toast('Poné un valor mayor a 0'); save(() => STORE.putSettings({ ...D.settings, usd_rate:n })); toast('Dólar guardado') }
  else if (a === 'mep'){
    try { const r = await fetch('https://dolarapi.com/v1/dolares/bolsa'); const j = await r.json(); if (!(j.venta > 0)) throw 0
      save(() => STORE.putSettings({ ...D.settings, usd_rate:j.venta, usd_source:'bolsa', usd_updated_at:new Date().toISOString() })); toast('Dólar MEP: ' + money(j.venta)) }
    catch { toast('No se pudo traer el dólar. Probá más tarde.') }
  }
  else if (a === 'quotes') updateQuotes()
  else if (a === 'export'){
    const blob = new Blob([JSON.stringify(D, null, 2)], { type:'application/json' })
    const url = URL.createObjectURL(blob), l = document.createElement('a'); l.href = url; l.download = 'myfinance-copia-' + todayStr() + '.json'; l.click(); setTimeout(() => URL.revokeObjectURL(url), 1000)
  }
  else if (a === 'import'){
    const f = document.createElement('input'); f.type = 'file'; f.accept = '.json,application/json'
    f.onchange = async () => {
      try { const j = JSON.parse(await f.files[0].text()); if (!confirm('Esto agrega los datos de la copia a los que ya tenés. ¿Seguir?')) return
        await save(async () => { if (j.settings) await STORE.putSettings({ ...D.settings, ...j.settings }); for (const c of COLLS) for (const r of (j[c] || [])) if (r && r.id) await STORE.put(c, r) }); toast('Copia restaurada') }
      catch { toast('Ese archivo no es una copia válida') }
    }
    f.click()
  }
  else if (a === 'logout'){ if (window.SB) await window.SB.auth.signOut(); location.reload() }
  else if (a === 'gocloud'){ try { localStorage.removeItem(MODE_KEY) } catch {} location.reload() }
})

async function updateQuotes(){
  const inv = D.investments.filter(i => i.ticker)
  toast('Buscando precios…')
  try {
    const r = await fetch('api/quote?symbols=' + encodeURIComponent([...new Set(inv.map(i => i.ticker))].join(',')))
    if (!r.ok) throw 0
    const j = await r.json(); let n = 0
    await save(async () => { for (const i of inv){ const q = j[i.ticker]; if (q && q.price > 0){ await STORE.put('investments', { ...i, current_price:q.price, price_updated_at:new Date().toISOString() }); n++ } } })
    toast(n ? 'Precios actualizados' : 'No se encontraron precios para esos códigos')
  } catch { toast('No se pudieron traer los precios (solo funciona con la app publicada)') }
}

/* ============ Arranque: solo en este dispositivo o con cuenta (Supabase) ============ */
function getCfg(){
  const c = window.MYFINANCE_CONFIG
  if (c && c.supabaseUrl && c.supabaseKey && !String(c.supabaseUrl).includes('TU-PROYECTO')) return { url:c.supabaseUrl, key:c.supabaseKey, fixed:true }
  try { const t = JSON.parse(localStorage.getItem(CFG_KEY) || 'null'); if (t && t.url && t.key) return t } catch {}
  return null
}
function loadScript(src){ return new Promise((ok, ko) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = ko; document.head.appendChild(s) }) }
function screen(html){ app.innerHTML = `<div class="auth"><div class="card">${LOGO}<div style="height:10px"></div>${html}</div></div>` }

async function start(){
  const cfg = getCfg()
  let mode = null; try { mode = localStorage.getItem(MODE_KEY) } catch {}
  if (!cfg && mode === 'local') return go(localStore())
  if (!cfg) return setupScreen()
  screen('<p>Cargando…</p>')
  try {
    await loadScript('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js')
    const sb = window.SB = window.supabase.createClient(cfg.url, cfg.key)
    const { data } = await sb.auth.getSession()
    if (data.session) return go(cloudStore(sb, data.session.user), data.session.user.email)
    loginScreen(sb, cfg)
  } catch (e) { screen(`<h1>No se pudo conectar</h1><p class="sub">Revisá tu conexión a internet y volvé a intentar.</p><button class="btn dark" onclick="location.reload()">Reintentar</button>`) }
}
function setupScreen(){
  screen(`<h1>Bienvenida a MyFinance</h1><p class="sub">¿Dónde querés guardar tus datos?</p>
    <div class="actions"><button class="btn dark" id="loc">Solo en este dispositivo</button><button class="btn ghost" id="cl">En mi cuenta, para usarla en varios dispositivos</button></div>
    <div id="cf" style="display:none"><div class="f"><label for="u">URL del proyecto de Supabase</label><input id="u" class="inp" placeholder="https://xxxx.supabase.co"></div>
    <div class="f"><label for="k">Clave "anon public"</label><input id="k" class="inp"></div>
    <details class="adv"><summary>Primera vez: SQL para crear la tabla</summary><pre class="sql">${esc(SQL)}</pre></details>
    <div class="err" id="er"></div><button class="btn dark" id="go" style="margin-top:12px">Conectar</button></div>`)
  document.getElementById('loc').onclick = () => { try { localStorage.setItem(MODE_KEY, 'local') } catch {} go(localStore()) }
  document.getElementById('cl').onclick = () => { document.getElementById('cf').style.display = '' }
  document.getElementById('go').onclick = () => {
    const url = document.getElementById('u').value.trim().replace(/\/+$/, ''), key = document.getElementById('k').value.trim()
    if (!/^https:\/\/[a-z0-9-]+\.supabase\.co$/i.test(url) || !key) { document.getElementById('er').textContent = 'Revisá la URL y la clave.'; return }
    try { localStorage.setItem(CFG_KEY, JSON.stringify({ url, key })) } catch {}
    start()
  }
}
function loginScreen(sb, cfg){
  screen(`<h1>Entrá a tu cuenta</h1><p class="sub">Con tu cuenta ves los mismos datos en el celular y en la compu.</p>
    <div class="f"><label for="em">Email</label><input id="em" type="email" class="inp" autocomplete="email"></div>
    <div class="f"><label for="pw">Contraseña</label><input id="pw" type="password" class="inp" autocomplete="current-password"></div>
    <div class="err" id="er"></div>
    <div class="actions"><button class="btn dark" id="in">Entrar</button><button class="btn ghost" id="up">Crear cuenta</button>
    ${!cfg.fixed ? `<button class="btn ghost" id="ch" style="font-size:14px">Cambiar proyecto de Supabase</button>` : ''}</div>`)
  const $ = id => document.getElementById(id), creds = () => ({ email:$('em').value.trim(), password:$('pw').value })
  $('in').onclick = async () => { $('er').textContent = ''; const { data, error } = await sb.auth.signInWithPassword(creds()); if (error) $('er').textContent = 'Email o contraseña incorrectos.'; else go(cloudStore(sb, data.user), data.user.email) }
  $('up').onclick = async () => { $('er').textContent = ''; const { data, error } = await sb.auth.signUp(creds()); if (error) $('er').textContent = error.message; else if (!data.session) $('er').textContent = 'Te mandamos un mail para confirmar la cuenta. Confirmala y después entrá.'; else go(cloudStore(sb, data.user), data.user.email) }
  if ($('ch')) $('ch').onclick = () => { try { localStorage.removeItem(CFG_KEY) } catch {} location.reload() }
}
async function go(store, email){
  STORE = store; ACCOUNT = email || null
  try { D = await store.load() } catch (e) { toast('No se pudieron cargar los datos: ' + e.message) }
  render()
  if (store.mode === 'nube') document.addEventListener('visibilitychange', async () => {
    if (document.visibilityState === 'visible' && !document.querySelector('.ov')) { try { D = await store.load(); render() } catch {} }
  })
}
start()
</script>
